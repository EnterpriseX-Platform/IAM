version: '3.8'

services:
  api:
    container_name: my-app-api
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - APP_PROFILE=${APP_PROFILE:-local}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=${APP_PROFILE:-development}
      # Oracle Database (Original)
      - DB_HOST=127.0.0.1
      - DB_PORT=1521
      - DB_USER=app
      - DB_PASSWORD=change-me
      - DB_NAME=resdb
      - JWT_SECRET=change-me-to-a-long-random-string
    networks:
      - my-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/iamx/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: my-app-web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - APP_PROFILE=${APP_PROFILE:-local}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://api:8080
    depends_on:
      - api
    networks:
      - my-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  my-app-network:
    driver: bridge
