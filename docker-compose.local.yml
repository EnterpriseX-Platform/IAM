# ============================================================
# Local dev stack — Oracle XE 21 + iamx-api
# Use:  docker compose -f docker-compose.local.yml up -d
# Init takes ~2-3 min on first start (Oracle XE bootstraps PDB).
# ============================================================

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: iamx-oracle-local
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"
    volumes:
      # 01_setup.sql runs as SYSDBA → creates IAMX/APP users + M_AGC + ADMIN.
      # 02_run_iamx.sh runs as oracle user → connects as IAMX and applies
      # the DDL + seed so tables/views/indexes are owned by IAMX.
      # iamx.sql + iamx_seed.sql are mounted under /sql/ (not the
      # auto-run path) so they're only invoked from the shell script.
      - ./api/schema/oracle/local/01_setup.sql:/container-entrypoint-initdb.d/01_setup.sql:ro
      - ./api/schema/oracle/local/02_run_iamx.sh:/container-entrypoint-initdb.d/02_run_iamx.sh:ro
      - ./api/schema/oracle/iamx.sql:/sql/iamx.sql:ro
      - ./api/schema/oracle/local/03_seed.sql:/sql/iamx_seed.sql:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 60s

  iamx-api:
    container_name: iamx-api-local
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      # ENV intentionally empty — main.go's loadEnv() loads .env.<ENV>
      # which doesn't ship in the runtime image; we want it to fall
      # straight through to env vars from this compose file.
      ENV: ""
      PORT: 8080
      # Oracle (local container) — develops branch uses ORACLE_* env names
      # (database.go: getEnv("ORACLE_HOST", ...) etc.). The legacy DB_*
      # names are not read.
      # Use IP because go-ora's URL parser treats certain hostnames oddly
      # — the literal "iamx-oracle-local" was reaching Oracle but returning
      # ORA-01017 even with valid creds. The IP works.
      ORACLE_HOST: 172.26.0.2
      ORACLE_PORT: 1521
      ORACLE_USER: IAMX
      ORACLE_PASSWORD: iamxpw
      ORACLE_SERVICE: XEPDB1
      # JWT secret — must be ≥32 chars per requireSecureEnv()
      JWT_SECRET: local-dev-secret-do-not-use-in-prod-32chars
      # Keycloak — required by requireSecureEnv() at startup. The actual
      # JWKS fetch only happens on /public/me/* requests, so any URL works
      # for endpoints that don't require KC token.
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_URL: https://iam.example.com/idp
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: iamx-app
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8081:8080"   # host:container — host 8081 maps to API's 8080
    restart: unless-stopped

  iamx-web:
    container_name: iamx-web-local
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        APP_PROFILE: local-stack    # picks web/.env.local-stack
    depends_on:
      - iamx-api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  oracle-data:
